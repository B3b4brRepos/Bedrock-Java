name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: grep -E -A3 "error:|FAILED|What went wrong" build.log | head -60 || true

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: originalsword-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Pushing a tag like v1.0.0 also publishes the jar as a GitHub Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
